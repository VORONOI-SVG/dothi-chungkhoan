name: Update Vietnamese Stock Data

on:
  schedule:
    # Chạy vào lúc 18:30 UTC = 01:30 sáng giờ Việt Nam (sau khi chốt phiên cuối ngày)
    - cron: '30 18 * * 1-5'
  workflow_dispatch: # Cho phép nhấn chạy thủ công bằng tay

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests yfinance pandas

      - name: Fetch stock data
        run: python scripts/fetch_stocks.py

      - name: Commit & push data files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update stock via Yahoo Finance $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi
