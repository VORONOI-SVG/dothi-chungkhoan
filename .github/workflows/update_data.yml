name: Update Vietnamese Stock Data

on:
  schedule:
    # 10:30 UTC = 17:30 giờ Việt Nam (sau khi HOSE đóng cửa 14:45), thứ 2 - thứ 6
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Fetch stock data
        run: python scripts/fetch_data.py

      - name: Build screener index
        run: python scripts/build_screener.py

      - name: Commit & push data files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update stock via Yahoo Finance $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi
