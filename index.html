<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VN Stock Chart – Biểu đồ chứng khoán Việt Nam</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;
      --border:#21262d;--accent:#2ecc71;--red:#e74c3c;
      --blue:#3498db;--orange:#e67e22;
      --text:#e6edf3;--muted:#8b949e;
      --shadow:0 4px 24px rgba(0,0,0,.5);
      --radius:7px;--font:'Inter','Segoe UI',system-ui,sans-serif;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);
              font-family:var(--font);font-size:14px;line-height:1.5}
    .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ── Header ─────────────────────────────── */
    header{display:flex;align-items:center;gap:12px;padding:8px 16px;
           background:var(--surface);border-bottom:1px solid var(--border);
           flex-shrink:0;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:7px;font-weight:700;
          font-size:16px;white-space:nowrap}
    .logo-icon{width:26px;height:26px;background:var(--accent);border-radius:5px;
               display:flex;align-items:center;justify-content:center;font-size:14px}

    /* ── Search ──────────────────────────────── */
    .search-wrap{position:relative;flex:1;max-width:460px}
    .search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);
                color:var(--muted);pointer-events:none}
    #q{width:100%;padding:7px 30px 7px 34px;background:var(--surface2);
       border:1px solid var(--border);border-radius:var(--radius);
       color:var(--text);font-size:14px;font-family:var(--font);outline:none;
       transition:border-color .2s;text-transform:uppercase}
    #q::placeholder{color:var(--muted);text-transform:none}
    #q:focus{border-color:var(--accent)}
    #clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);
         background:none;border:none;color:var(--muted);cursor:pointer;
         display:none;font-size:13px;line-height:1}
    #clr:hover{color:var(--text)}

    /* ── Autocomplete ────────────────────────── */
    #ac{position:absolute;top:calc(100% + 4px);left:0;right:0;
        background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);max-height:280px;overflow-y:auto;
        z-index:200;box-shadow:var(--shadow);display:none}
    #ac::-webkit-scrollbar{width:4px}
    #ac::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .ac-hdr{padding:5px 12px 3px;font-size:10px;font-weight:700;
            color:var(--muted);text-transform:uppercase;letter-spacing:.7px;
            border-bottom:1px solid var(--border)}
    .ac-row{display:flex;align-items:center;gap:9px;padding:7px 12px;
            cursor:pointer;transition:background .12s}
    .ac-row:hover,.ac-row.sel{background:var(--surface2)}
    .ac-t{font-weight:700;font-size:13px;min-width:56px}
    .ac-n{color:var(--muted);font-size:12px;flex:1;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ac-ex{font-size:10px;font-weight:700;padding:2px 5px;
           border-radius:3px;flex-shrink:0}
    .ac-ex.HOSE{background:rgba(46,204,113,.15);color:var(--accent)}
    .ac-ex.HNX {background:rgba(52,152,219,.15);color:var(--blue)}
    .ac-ex.UPCOM{background:rgba(230,126,34,.15);color:var(--orange)}

    /* ── Exchange filter tabs ────────────────── */
    .ex-tabs{display:flex;gap:3px}
    .ex-tab{padding:4px 10px;border-radius:5px;border:1px solid var(--border);
            background:transparent;color:var(--muted);font-size:11px;
            font-weight:700;cursor:pointer;transition:all .15s}
    .ex-tab:hover{color:var(--text);border-color:var(--muted)}
    .ex-tab.on{color:#000;border-color:transparent}
    .ex-tab[data-ex=ALL].on{background:var(--muted)}
    .ex-tab[data-ex=HOSE].on{background:var(--accent)}
    .ex-tab[data-ex=HNX].on{background:var(--blue)}
    .ex-tab[data-ex=UPCOM].on{background:var(--orange)}

    /* ── Count badge ─────────────────────────── */
    #cnt{font-size:11px;color:var(--muted);padding:3px 8px;
         border-radius:12px;border:1px solid var(--border);white-space:nowrap}
    #cnt.ok{border-color:rgba(46,204,113,.35);color:var(--accent)}

    /* ── Quick access pills ──────────────────── */
    .quick{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .qlbl{font-size:11px;color:var(--muted);white-space:nowrap}
    .qpill{padding:3px 9px;border-radius:20px;border:1px solid var(--border);
           background:transparent;color:var(--muted);font-size:11px;
           font-weight:700;cursor:pointer;transition:all .15s}
    .qpill:hover{border-color:var(--accent);color:var(--accent)}
    .qpill.on{background:rgba(46,204,113,.15);border-color:var(--accent);color:var(--accent)}

    /* ── Chart toolbar ───────────────────────── */
    #ctb{display:none;align-items:center;gap:0;
         background:var(--surface);border-bottom:1px solid var(--border);
         flex-shrink:0;overflow:hidden}
    #ctb.vis{display:flex}
    .ctb-left{display:flex;align-items:center;gap:10px;padding:6px 14px;
              flex:1;flex-wrap:wrap;min-width:0}
    .ctb-sym{font-weight:700;font-size:14px}
    .ctb-nm{color:var(--muted);font-size:12px}
    .ctb-ex{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
    .ctb-ex.HOSE{background:rgba(46,204,113,.15);color:var(--accent)}
    .ctb-ex.HNX {background:rgba(52,152,219,.15);color:var(--blue)}
    .ctb-ex.UPCOM{background:rgba(230,126,34,.15);color:var(--orange)}

    .ctb-right{display:flex;align-items:center;gap:4px;padding:6px 14px;
               border-left:1px solid var(--border);flex-shrink:0}
    .ctb-lbl{font-size:11px;color:var(--muted);margin-right:2px}
    .xbtn{padding:3px 9px;border-radius:5px;border:1px solid var(--border);
          background:transparent;color:var(--muted);font-size:11px;
          font-weight:700;cursor:pointer;transition:all .15s}
    .xbtn:hover{color:var(--text);border-color:var(--muted)}
    .xbtn.on{color:#000;border-color:transparent}
    .xbtn[data-x=HOSE].on{background:var(--accent)}
    .xbtn[data-x=HNX].on{background:var(--blue)}
    .xbtn[data-x=UPCOM].on{background:var(--orange)}

    /* ── Time-range & Resolution buttons ─────── */
    .range-bar{display:flex;align-items:center;gap:4px;padding:5px 14px;
               background:var(--surface);border-bottom:1px solid var(--border);
               flex-shrink:0;display:none}
    .range-bar.vis{display:flex}
    .rbtn,.resbtn{padding:3px 9px;border-radius:5px;border:1px solid transparent;
                  background:transparent;color:var(--muted);font-size:11px;
                  font-weight:600;cursor:pointer;transition:all .15s}
    .rbtn:hover,.resbtn:hover{color:var(--text)}
    .rbtn.on,.resbtn.on{background:var(--surface2);color:var(--text);
                         border-color:var(--border)}
    .rb-sep{width:1px;height:16px;background:var(--border);margin:0 4px}
    .rb-right{margin-left:auto;display:flex;gap:4px;align-items:center}
    .ma-toggle{padding:3px 8px;border-radius:5px;border:1px solid var(--border);
               background:transparent;font-size:11px;font-weight:600;cursor:pointer;
               transition:all .15s}
    .ma-toggle.on{color:#000}
    #ma20-toggle{color:var(--blue)}
    #ma20-toggle.on{background:var(--blue);border-color:var(--blue)}
    #ma50-toggle{color:var(--orange)}
    #ma50-toggle.on{background:var(--orange);border-color:var(--orange)}

    /* ── Chart area ──────────────────────────── */
    .chart-area{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
    #chart{flex:1;min-height:0}
    #vol-chart{height:80px;flex-shrink:0}

    /* ── Loading / empty ─────────────────────── */
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;
             align-items:center;justify-content:center;gap:12px;
             color:var(--muted);pointer-events:none;z-index:10}
    .overlay.hidden{display:none}
    .overlay svg{opacity:.2}
    .spin{width:32px;height:32px;border:3px solid var(--border);
          border-top-color:var(--accent);border-radius:50%;
          animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err-msg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);
             color:var(--red);padding:10px 16px;border-radius:var(--radius);
             font-size:13px;max-width:380px;text-align:center}

    /* ── Status bar ──────────────────────────── */
    .sbar{display:flex;align-items:center;gap:10px;padding:4px 16px;
          background:var(--surface);border-top:1px solid var(--border);
          flex-shrink:0;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .sbar a{color:var(--muted);text-decoration:none}
    .sbar a:hover{color:var(--text)}
    .sbar-r{margin-left:auto}
    #ohlc{display:flex;gap:12px;align-items:center;font-size:11px}
    .ohlc-lbl{color:var(--muted)}
    .ohlc-v{color:var(--text);font-weight:600}
    .ohlc-chg.up{color:var(--accent)}
    .ohlc-chg.dn{color:var(--red)}

    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>

<div class="app">

    <div class="ex-tabs">
      <button class="ex-tab on" data-ex="ALL">Tất cả</button>

      <button class="ex-tab" data-ex="UPCOM">UPCOM</button>
    </div>

    <span id="cnt">Đang tải...</span>

    <div class="quick" id="qlist"></div>
  </header>

  <!-- Chart toolbar (exchange switcher) -->
  <div id="ctb">
    <div class="ctb-left">
      <span class="ctb-sym" id="ctb-sym"></span>
      <span class="ctb-nm"  id="ctb-nm"></span>
      <span class="ctb-ex"  id="ctb-ex"></span>
    </div>
    <div class="ctb-right">
      <span class="ctb-lbl">Đổi sàn:</span>
      <button class="xbtn" data-x="HOSE">HOSE</button>
      <button class="xbtn" data-x="HNX">HNX</button>
      <button class="xbtn" data-x="UPCOM">UPCOM</button>
    </div>
  </div>

  <!-- Range / resolution bar -->
  <div class="range-bar" id="rbar">
    <button class="rbtn" data-r="7">1T</button>
    <button class="rbtn" data-r="30">1M</button>
    <button class="rbtn" data-r="90">3M</button>
    <button class="rbtn on" data-r="365">1N</button>
    <button class="rbtn" data-r="1095">3N</button>
    <button class="rbtn" data-r="3650">10N</button>
    <button class="rbtn" data-r="0">Tất cả</button>
    <div class="rb-sep"></div>
    <button class="resbtn on" data-res="D">Ngày</button>
    <button class="resbtn" data-res="W">Tuần</button>
    <button class="resbtn" data-res="M">Tháng</button>
    <div class="rb-right">
      <span class="ctb-lbl">MA:</span>
      <button class="ma-toggle" id="ma20-toggle" data-ma="20">MA20</button>
      <button class="ma-toggle" id="ma50-toggle" data-ma="50">MA50</button>
    </div>
  </div>

  <!-- Chart area -->
  <div class="chart-area" id="chart-area">
    <div id="chart"></div>
    <div id="vol-chart"></div>

    <!-- Empty state -->
    <div class="overlay" id="empty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <p>Nhập mã chứng khoán để xem biểu đồ</p>
      <small id="empty-hint">Đang tải danh sách...</small>
    </div>

    <!-- Loading state -->
    <div class="overlay hidden" id="loading">
      <div class="spin"></div>
      <span style="color:var(--muted);font-size:13px">Đang tải dữ liệu...</span>
    </div>

    <!-- Error state -->
    <div class="overlay hidden" id="errmsg">
      <div class="err-msg" id="err-txt"></div>
    </div>
  </div>

  <!-- Status / OHLC bar -->
  <div class="sbar">
    <div id="ohlc" style="display:none">
      <span class="ohlc-lbl">O</span><span class="ohlc-v" id="ov-o">—</span>
      <span class="ohlc-lbl">H</span><span class="ohlc-v" id="ov-h">—</span>
      <span class="ohlc-lbl">L</span><span class="ohlc-v" id="ov-l">—</span>
      <span class="ohlc-lbl">C</span><span class="ohlc-v" id="ov-c">—</span>
      <span class="ohlc-chg" id="ov-chg"></span>
    </div>
    <span>Dữ liệu: <a href="https://tcbs.com.vn" target="_blank">TCBS</a> ·
          Biểu đồ: <a href="https://tradingview.com/lightweight-charts/" target="_blank">Lightweight Charts</a></span>
    <span class="sbar-r">HOSE · HNX · UPCOM &nbsp;·&nbsp; © VN Chart 2025</span>

</div>

const FMT_PRICE = v => v == null ? '—' : v.toLocaleString('vi-VN');
const FMT_VOL   = v => {
  if (!v) return '—';
  if (v >= 1e9)  return (v/1e9).toFixed(2)  + ' tỷ';
  if (v >= 1e6)  return (v/1e6).toFixed(2)  + ' tr';
  if (v >= 1e3)  return (v/1e3).toFixed(1)  + ' k';
  return String(v);
};

document.addEventListener('DOMContentLoaded', async () => {
  buildQuickList();

  updateCount('Đang tải…', false);

  try { await fetchTickerList(); }

/* ══════════════════════════════════════════════════════════
   TICKER LIST  – TCBS public API
   ══════════════════════════════════════════════════════════ */
async function fetchTickerList() {
  const BASE = 'https://apipubaws.tcbs.com.vn/stock-insight/v2/stock/ticker?locale=vi&page=0&size=2000';
  // corsproxy.io: raw URL after "?" (NOT encoded)
  // allorigins, codetabs: URL encoded in query param
  const urls = [
    BASE,
    `https://corsproxy.io/?${BASE}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(BASE)}`,
    `https://thingproxy.freeboard.io/fetch/${BASE}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(BASE)}`,
  ];

  for (const url of urls) {
    try {
      const res  = await fetchWithTimeout(url, 8000);
      if (!res.ok) continue;
      const json = await res.json();
      const rows = json?.data || [];
      if (rows.length < 50) continue;

      STOCKS = rows.map(r => {
        const ex = normEx(r.exchange || r.comGroupCode || '');
        return ex ? [r.ticker, r.organName || r.shortName || r.ticker, ex] : null;
      }).filter(Boolean);

      buildMap();
      updateCount(`${STOCKS.length} mã`, true);
      document.getElementById('empty-hint').textContent =
        `Hỗ trợ ${STOCKS.length}+ mã HOSE · HNX · UPCOM`;
      return; // success
    } catch { /* try next */ }
  }
  throw new Error('All ticker sources failed');
}

function initCharts() {

    layout: { background:{type:'solid',color:'#0d1117'}, textColor:'#8b949e' },
    grid:   { vertLines:{color:'#161b22'}, horzLines:{color:'#161b22'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { borderColor:'#21262d', timeVisible:true, secondsVisible:false },
    rightPriceScale: { borderColor:'#21262d' },
    handleScale:{ mouseWheel:true, pinch:true },
    handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true },
  };

  const cEl = document.getElementById('chart');
  const vEl = document.getElementById('vol-chart');

  mainChart = LightweightCharts.createChart(cEl, { ...COMMON, autoSize:true });
  volChart  = LightweightCharts.createChart(vEl, {
    ...COMMON, autoSize:true,
    rightPriceScale:{ visible:false, borderColor:'#21262d' },
    leftPriceScale: { visible:false },
    timeScale:{ visible:false, borderColor:'#21262d' },
    crosshair:{ vertLine:{visible:true}, horzLine:{visible:false} },
  });

  candleSeries = mainChart.addCandlestickSeries({
    upColor:'#2ecc71', downColor:'#e74c3c',
    borderUpColor:'#2ecc71', borderDownColor:'#e74c3c',
    wickUpColor:'#2ecc71', wickDownColor:'#e74c3c',
  });
  volSeries = volChart.addHistogramSeries({
    priceFormat:{type:'volume'},
    priceScaleId:'',
  });
  volChart.priceScale('').applyOptions({ scaleMargins:{top:0.1, bottom:0} });

  // Sync crosshair & scroll between charts
  let syncing = false;
  function syncCross(src, tgt) {
    src.subscribeCrosshairMove(p => {
      if (syncing) return; syncing=true;
      tgt.setCrosshairPosition(p.seriesData?.get(candleSeries)?.close??0,
                               p.time??null, volSeries);
      syncing=false;
    });
  }
  syncCross(mainChart, volChart);

  mainChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing) return; syncing=true;
    volChart.timeScale().setVisibleLogicalRange(r);
    syncing=false;
  });
  volChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing) return; syncing=true;
    mainChart.timeScale().setVisibleLogicalRange(r);
    syncing=false;
  });

  // OHLC tooltip on hover
  mainChart.subscribeCrosshairMove(p => {
    const bar = p.seriesData?.get(candleSeries);
    if (!bar) return;
    const prev = candleSeries.dataByIndex(p.logical - 1);
    const chg  = prev ? ((bar.close - prev.close)/prev.close*100) : 0;
    document.getElementById('ov-o').textContent = FMT_PRICE(bar.open);
    document.getElementById('ov-h').textContent = FMT_PRICE(bar.high);
    document.getElementById('ov-l').textContent = FMT_PRICE(bar.low);
    document.getElementById('ov-c').textContent = FMT_PRICE(bar.close);
    const chgEl = document.getElementById('ov-chg');
    chgEl.textContent = (chg>=0?'+':'')+chg.toFixed(2)+'%';
    chgEl.className = 'ohlc-chg '+(chg>=0?'up':'dn');
  });

  // Window resize
  window.addEventListener('resize', () => {
    mainChart.applyOptions({ width: cEl.offsetWidth });
    volChart.applyOptions({ width: vEl.offsetWidth });
  });
}

/* ══════════════════════════════════════════════════════════
   FETCH HELPER – AbortController-based timeout (cross-browser)
   ══════════════════════════════════════════════════════════ */
function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal })
    .then(r => { clearTimeout(tid); return r; })
    .catch(e => { clearTimeout(tid); throw e; });
}

/* ── Try one URL, return parsed candles or null ──────── */
async function trySource(url, parseFn, label, timeoutMs) {
  try {
    const res = await fetchWithTimeout(url, timeoutMs);
    if (!res.ok) { console.warn(`[VNChart] ${label} HTTP ${res.status}`); return null; }
    const json = await res.json();
    const candles = parseFn(json);
    if (candles && candles.length >= 2) {
      console.info(`[VNChart] ✓ ${label}`);
      return candles;
    }
    console.warn(`[VNChart] ${label} no candles`);
    return null;
  } catch (e) {
    console.warn(`[VNChart] ${label} error:`, e.message);
    return null;
  }
}

/* ══════════════════════════════════════════════════════════
   LOAD CHART DATA
   Strategy (in order):
     0. Local data file  data/{TICKER}.json  ← same-origin, ALWAYS works
        (generated by GitHub Actions daily – see scripts/fetch_stocks.py)
     1. Entrade X (KB Securities) – CORS may be open depending on network
     2. SSI iBoard                – CORS may be open
     3. TCBS direct               – CORS-blocked on most browsers
     4–7. CORS proxies            – last resort
   ══════════════════════════════════════════════════════════ */
async function loadChartData() {
  if (!curTicker) return;
  showState('loading');

  const now  = Math.floor(Date.now() / 1000);
  const from = rangeDays > 0
    ? now - rangeDays * 86400
    : Math.floor(new Date('2000-01-01').getTime() / 1000);

  const rD = resolution;
  const rE = resolution === 'W' ? '1W' : resolution === 'M' ? '1M' : '1D';
  const t  = encodeURIComponent(curTicker);

  /* ── Phase 0: local pre-generated file (same-origin, no CORS) ── */
  let candles = await trySource(
    `data/${curTicker}.json`,
    json => parseLocalFile(json, from, resolution),
    'local', 5000
  );

  /* ── Phase 1: race Entrade X vs SSI (live APIs) ──────────────── */
  if (!candles) {
    const ENTRADE = `https://services.entrade.com.vn/chart-api/v2/ohlcs/stock` +
      `?from=${from}&to=${now}&symbol=${t}&resolution=${rE}`;
    const SSI = `https://iboard-query.ssi.com.vn/v2/stock-price/his-price` +
      `?symbol=${t}&resolution=${rD}&from=${from}&to=${now}`;
    candles = await Promise.any([
      trySource(ENTRADE, parseTVFormat, 'Entrade', 8000),
      trySource(SSI,     parseTVFormat, 'SSI',     8000),
    ].map(p => p.then(c => c ?? Promise.reject('no data')))).catch(() => null);
  }

  /* ── Phase 2: TCBS direct ─────────────────────────────────────── */
  if (!candles) {
    const TCBS = `https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/his-price` +
      `?ticker=${t}&type=stock&resolution=${rD}&from=${from}&to=${now}`;
    candles = await trySource(TCBS, parseTCBS, 'TCBS', 10000);

    /* ── Phase 3: CORS proxies wrapping TCBS ──────────────────── */
    if (!candles) candles = await trySource(
      `https://corsproxy.io/?${TCBS}`, parseTCBS, 'corsproxy.io', 10000);
    if (!candles) candles = await trySource(
      `https://api.allorigins.win/raw?url=${encodeURIComponent(TCBS)}`,
      parseTCBS, 'allorigins', 10000);
    if (!candles) candles = await trySource(
      `https://thingproxy.freeboard.io/fetch/${TCBS}`,
      parseTCBS, 'thingproxy', 10000);
    if (!candles) candles = await trySource(
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(TCBS)}`,
      parseTCBS, 'codetabs', 10000);
  }

  if (!candles) {
    showState('error',
      `Không tải được dữ liệu cho mã "${curTicker}".\n` +
      `💡 Thiếu file data/${curTicker}.json – chạy GitHub Actions để tạo dữ liệu.\n` +
      `Xem Console (F12) để biết chi tiết.`
    );
    return;
  }

  const volData = candles.map(c => ({
    time:  c.time,
    value: c.volume,
    color: c.close >= c.open ? 'rgba(46,204,113,.5)' : 'rgba(231,76,60,.5)',
  }));
  candleSeries.setData(candles);
  volSeries.setData(volData);
  renderMA(candles);
  mainChart.timeScale().fitContent();
  showState('chart');
  document.getElementById('ohlc').style.display = 'flex';
}

/* ── Parsers ─────────────────────────────────────────── */

// Local pre-generated file format (from scripts/fetch_stocks.py):
// { ticker, exchange, updated, candles: [[ts,o,h,l,c,v], ...] }
function parseLocalFile(json, fromTs, res) {
  const candles = json?.candles;
  if (!Array.isArray(candles) || candles.length < 2) return null;
  // Local files always store daily data; if user wants W/M, aggregate
  let filtered = candles.filter(([ts]) => ts >= fromTs);
  if (!filtered.length) filtered = candles; // fallback: show all

  if (res === 'D') {
    return filtered.map(([ts,o,h,l,c,v]) => ({
      time:ts, open:o, high:h, low:l, close:c, volume:v
    })).filter(r => isFinite(r.open) && isFinite(r.close));
  }

  // Aggregate to weekly (Mon) or monthly (1st) buckets
  const bucketKey = ts => {
    const d = new Date(ts * 1000);
    if (res === 'W') {
      const day = d.getUTCDay();
      return ts - (day === 0 ? 6 : day - 1) * 86400; // normalise to Monday
    }
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000;
  };

  const map = new Map();
  for (const [ts, o, h, l, c, v] of filtered) {
    const k = bucketKey(ts);
    if (!map.has(k)) map.set(k, { time:k, open:o, high:h, low:l, close:c, volume:v });
    else {
      const b = map.get(k);
      b.high = Math.max(b.high, h);
      b.low  = Math.min(b.low,  l);
      b.close = c;
      b.volume += v;
    }
  }
  const agg = [...map.values()].sort((a,b) => a.time - b.time);
  return agg.length >= 2 ? agg : null;
}

// TradingView-compatible format: { t:[ts], o:[...], h:[...], l:[...], c:[...], v:[...] }
// Used by Entrade X and SSI iBoard
function parseTVFormat(json) {
  const t = json?.t || json?.time || [];
  const o = json?.o || json?.open  || [];
  const h = json?.h || json?.high  || [];
  const l = json?.l || json?.low   || [];
  const c = json?.c || json?.close || [];
  const v = json?.v || json?.volume|| [];
  if (!Array.isArray(t) || !t.length) return null;

  const candles = t.map((ts, i) => {
    const ov=+o[i], hv=+h[i], lv=+l[i], cv=+c[i];
    // Reject any bar with non-finite OHLC
    if (!isFinite(ov)||!isFinite(hv)||!isFinite(lv)||!isFinite(cv)) return null;
    // ts might be seconds or milliseconds
    const sec = ts > 1e10 ? Math.floor(ts / 1000) : ts;
    // normalise to UTC midnight so Lightweight Charts date axis works correctly
    const d = new Date(sec * 1000);
    const midnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 1000;
    return { time: midnight, open:ov, high:hv, low:lv, close:cv, volume:isFinite(+v[i]) ? +v[i] : 0 };
  }).filter(Boolean).sort((a,b) => a.time - b.time);
  return dedup(candles);
}

// TCBS format: { data: [{ tradingDate, open, high, low, close, volume }] }
function parseTCBS(json) {
  const rows = json?.data || json?.stockPriceList || [];
  if (!rows.length) return null;
  const candles = rows.map(r => {
    const t = dateToTime(r.tradingDate || r.date);
    if (!t) return null;
    return {
      time:   t,
      open:  +(r.open  || r.priceOpen  || 0),
      high:  +(r.high  || r.priceHigh  || 0),
      low:   +(r.low   || r.priceLow   || 0),
      close: +(r.close || r.priceClose || 0),
      volume:+(r.volume|| r.dealVolume || 0),
    };
  }).filter(Boolean).sort((a,b) => a.time - b.time);
  return dedup(candles);
}

function dedup(arr) {
  const seen = new Set(), out = [];
  for (const c of arr) {
    if (!seen.has(c.time)) { seen.add(c.time); out.push(c); }
  }
  return out.length ? out : null;
}

function dateToTime(s) {
  if (!s) return null;
  // "2024-01-02T00:00:00" or "2024-01-02"
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return Math.floor(new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00Z`).getTime()/1000);
}

/* ── Moving averages ─────────────────────────────────── */
function calcMA(data, n) {
  const out = [];
  for (let i=n-1; i<data.length; i++) {
    const sum = data.slice(i-n+1,i+1).reduce((a,c)=>a+c.close,0);
    out.push({ time: data[i].time, value: sum/n });
  }
  return out;
}

function renderMA(data) {
  if (!ma20Series) {
    ma20Series = mainChart.addLineSeries({ color:'#3498db', lineWidth:1,
      priceLineVisible:false, lastValueVisible:false });
  }
  if (!ma50Series) {
    ma50Series = mainChart.addLineSeries({ color:'#e67e22', lineWidth:1,
      priceLineVisible:false, lastValueVisible:false });
  }
  ma20Series.setData(ma20On && data.length>=20 ? calcMA(data,20) : []);
  ma50Series.setData(ma50On && data.length>=50 ? calcMA(data,50) : []);
}

function setupSearch() {
  const inp = document.getElementById('q');
  const clr = document.getElementById('clr');

  inp.addEventListener('input', () => {
    acIdx = -1;
    clr.style.display = inp.value ? 'block' : 'none';
    showAC(inp.value);
  });

  clr.addEventListener('click', () => {
    inp.value=''; clr.style.display='none'; closeAC(); inp.focus();
  });

  inp.addEventListener('keydown', e => {
    if (e.key==='ArrowDown') { e.preventDefault(); acIdx=Math.min(acIdx+1,acItems.length-1); highlightAC(); }
    else if (e.key==='ArrowUp') { e.preventDefault(); acIdx=Math.max(acIdx-1,-1); highlightAC(); }
    else if (e.key==='Enter') {
      e.preventDefault();
      if (acIdx>=0 && acItems[acIdx]) pickAC(acItems[acIdx]);
      else { const v=inp.value.trim().toUpperCase(); if(v) { closeAC(); loadTicker(v); } }
    }
    else if (e.key==='Escape') closeAC();
  });

  document.addEventListener('click', e => {
    if (!document.getElementById('sw').contains(e.target)) closeAC();
  });
}

function showAC(raw) {
  const val = raw.trim().toUpperCase();
  const el  = document.getElementById('ac');
  el.innerHTML=''; acItems=[]; acIdx=-1;
  if (!val || !STOCKS.length) { el.style.display='none'; return; }

  const exact=[], starts=[], name=[];
  STOCKS.forEach(item => {
    const [t,n,ex]=item;
    if (exFilter!=='ALL' && ex!==exFilter) return;
    if (t===val)                        exact.push(item);
    else if (t.startsWith(val))         starts.push(item);
    else if (n.toUpperCase().includes(val)) name.push(item);
  });

  const merged=[...exact,...starts,...name].slice(0,20);
  if (!merged.length) { el.style.display='none'; return; }
  acItems=merged;

  function grp(label, items) {
    if (!items.length) return;
    const hdr=document.createElement('div'); hdr.className='ac-hdr'; hdr.textContent=label;
    el.appendChild(hdr);
    items.forEach(item => {
      const [t,n,ex]=item;
      const row=document.createElement('div'); row.className='ac-row'; row.dataset.t=t;
      const ts=document.createElement('span'); ts.className='ac-t'; ts.textContent=t;
      const ns=document.createElement('span'); ns.className='ac-n'; ns.textContent=n;
      const es=document.createElement('span'); es.className=`ac-ex ${ex}`; es.textContent=ex;
      row.append(ts,ns,es);
      row.addEventListener('mouseenter',()=>{acIdx=acItems.indexOf(item);highlightAC();});
      row.addEventListener('click',()=>pickAC(item));
      el.appendChild(row);
    });
  }
  grp('Khớp chính xác', exact.slice(0,3));
  grp('Mã bắt đầu bằng', starts.slice(0,10));
  grp('Theo tên công ty', name.slice(0,8));

  el.style.display='block';
}

function highlightAC() {
  document.querySelectorAll('.ac-row').forEach(r =>
    r.classList.toggle('sel', r.dataset.t===acItems[acIdx]?.[0]));
}

function pickAC(item) {
  if (!item) return;
  const inp=document.getElementById('q');
  inp.value=item[0];
  document.getElementById('clr').style.display='block';
  closeAC(); loadTicker(item[0]);
}

function closeAC() {
  document.getElementById('ac').style.display='none';
  acItems=[]; acIdx=-1;
}
</script>
</body>
</html>
