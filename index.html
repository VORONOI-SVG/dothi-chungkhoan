<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VN Stock Chart – Biểu đồ chứng khoán Việt Nam</title>
  <style>
    /* ─── Reset & Tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --accent:    #2ecc71;
      --accent2:   #27ae60;
      --red:       #e74c3c;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --input-bg:  #1c2128;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
      --radius:    8px;
      --font:      'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ─── Layout ─────────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -.3px;
      color: var(--text);
      white-space: nowrap;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    /* ─── Search bar ─────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 480px;
    }
    .search-wrap svg {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    #ticker-input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color .2s;
      text-transform: uppercase;
    }
    #ticker-input::placeholder { color: var(--muted); text-transform: none; }
    #ticker-input:focus { border-color: var(--accent); }

    /* ─── Autocomplete dropdown ──────────────────────────────── */
    #autocomplete {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow);
      display: none;
    }
    #autocomplete::-webkit-scrollbar { width: 4px; }
    #autocomplete::-webkit-scrollbar-track { background: transparent; }
    #autocomplete::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ac-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background .15s;
    }
    .ac-item:hover, .ac-item.active { background: var(--input-bg); }
    .ac-ticker {
      font-weight: 600;
      font-size: 13px;
      min-width: 54px;
      color: var(--text);
    }
    .ac-name {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ac-exchange {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ─── Exchange tabs ──────────────────────────────────────── */
    .exchange-tabs {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .tab-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--muted); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

    /* ─── Watchlist pills ────────────────────────────────────── */
    .watchlist {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      padding: 0 20px 0 0;
    }
    .watch-label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .pill {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .pill.active { background: rgba(46,204,113,.15); border-color: var(--accent); color: var(--accent); }

    /* ─── Chart container ────────────────────────────────────── */
    .chart-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    #tv-chart-container {
      width: 100%;
      height: 100%;
    }

    /* ─── Status bar ─────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 5px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
    }
    .status-bar a {
      color: var(--muted);
      text-decoration: none;
    }
    .status-bar a:hover { color: var(--text); }
    .status-ticker {
      font-weight: 700;
      color: var(--text);
      font-size: 12px;
    }
    .status-change { font-weight: 600; }
    .status-change.up   { color: var(--accent); }
    .status-change.down { color: var(--red); }
    .status-sep { color: var(--border); }
    .status-right { margin-left: auto; }

    /* ─── Empty / loading placeholder ────────────────────────── */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    .empty-state svg { opacity: .25; }
    .empty-state p { font-size: 15px; }
    .empty-state small { font-size: 12px; }

    /* ─── Scrollbar (global) ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">📈</div>
      VN Chart
    </div>

    <!-- Search -->
    <div class="search-wrap" id="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="ticker-input"
             placeholder="Tìm mã CK (VD: VNM, VIC, HPG...)"
             autocomplete="off" spellcheck="false" />
      <div id="autocomplete"></div>
    </div>

    <!-- Exchange filter -->
    <div class="exchange-tabs">
      <button class="tab-btn active" data-ex="ALL">Tất cả</button>
      <button class="tab-btn" data-ex="HOSE">HOSE</button>
      <button class="tab-btn" data-ex="HNX">HNX</button>
      <button class="tab-btn" data-ex="UPCOM">UPCOM</button>
    </div>

    <!-- Quick access -->
    <div class="watchlist" id="quicklist"></div>
  </header>

  <!-- ── Chart ──────────────────────────────────────────── -->
  <div class="chart-container">
    <div id="tv-chart-container"></div>

    <div class="empty-state" id="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <p>Nhập mã chứng khoán để xem biểu đồ</p>
      <small>Hỗ trợ tất cả mã HOSE · HNX · UPCOM</small>
    </div>
  </div>

  <!-- ── Status bar ─────────────────────────────────────── -->
  <div class="status-bar">
    <span id="status-info">Chưa chọn mã nào</span>
    <span class="status-sep">|</span>
    <span>Nguồn dữ liệu: <a href="https://www.tradingview.com" target="_blank">TradingView</a></span>
    <span class="status-right">
      Sàn HOSE · HNX · UPCOM &nbsp;·&nbsp; © VN Chart 2025
    </span>
  </div>

</div>

<script>
/* ════════════════════════════════════════════════════════════════
   DATA – Vietnamese stocks (ticker, name, exchange)
   ════════════════════════════════════════════════════════════════ */
const STOCKS = [
  // ─── HOSE blue-chips ─────────────────────────────────────────
  ["VNM","Vinamilk","HOSE"],["VIC","Vingroup","HOSE"],["VHM","Vinhomes","HOSE"],
  ["HPG","Hòa Phát","HOSE"],["MSN","Masan Group","HOSE"],["TCB","Techcombank","HOSE"],
  ["VCB","Vietcombank","HOSE"],["BID","BIDV","HOSE"],["CTG","VietinBank","HOSE"],
  ["MBB","MB Bank","HOSE"],["ACB","ACB","HOSE"],["STB","Sacombank","HOSE"],
  ["EIB","Eximbank","HOSE"],["HDB","HDBank","HOSE"],["TPB","TPBank","HOSE"],
  ["VPB","VPBank","HOSE"],["LPB","LienVietPostBank","HOSE"],["OCB","OCB","HOSE"],
  ["SSI","SSI","HOSE"],["VND","VNDirect","HOSE"],["HCM","HCMC Securities","HOSE"],
  ["MWG","Mobile World","HOSE"],["FPT","FPT Corporation","HOSE"],["CMG","CMC Corp","HOSE"],
  ["REE","REE Corp","HOSE"],["PNJ","PNJ","HOSE"],["DGW","Digiworld","HOSE"],
  ["GVR","VRG","HOSE"],["PLX","Petrolimex","HOSE"],["GAS","PV Gas","HOSE"],
  ["BSR","Binh Son","HOSE"],["POW","PV Power","HOSE"],["NT2","NT2","HOSE"],
  ["VJC","Vietjet","HOSE"],["HVN","Vietnam Airlines","HOSE"],
  ["VRE","Vincom Retail","HOSE"],["KDH","Khang Điền","HOSE"],["NVL","Novaland","HOSE"],
  ["PDR","Phát Đạt Real","HOSE"],["DXG","Đất Xanh","HOSE"],["BCM","Becamex","HOSE"],
  ["PHR","Phước Hòa Rubber","HOSE"],["DPM","Đạm Phú Mỹ","HOSE"],["DCM","Đạm Cà Mau","HOSE"],
  ["HSG","Hoa Sen Steel","HOSE"],["NKG","Nam Kim","HOSE"],["TLH","TLH Steel","HOSE"],
  ["DHG","DHG Pharma","HOSE"],["IMP","Imexpharm","HOSE"],["DBD","DOMESCO","HOSE"],
  ["PAN","PAN Group","HOSE"],["HAG","HAGL","HOSE"],["HNG","HAGL Agri","HOSE"],
  ["SAB","Sabeco","HOSE"],["BHN","Habeco","HOSE"],["QNS","Quang Ngai Sugar","HOSE"],
  ["SBT","SBT Sugar","HOSE"],["LSS","Lam Son Sugar","HOSE"],
  ["VCS","Vinaconex Invest","HOSE"],["CTD","Coteccons","HOSE"],["HBC","Hòa Bình Corp","HOSE"],
  ["FCN","FECON","HOSE"],["CII","CII","HOSE"],["SCS","SCS Airport","HOSE"],
  ["AST","Airserco","HOSE"],["ACV","ACV","UPCOM"],
  ["VTP","Viettel Post","HOSE"],["GMD","Gemadept","HOSE"],["HAH","Hai An Trans","HOSE"],

  // ─── HNX ──────────────────────────────────────────────────────
  ["SHB","SHBank","HNX"],["PVS","PV Technical","HNX"],["PVC","PV Coating","HNX"],
  ["SHS","Sài Gòn-Hà Nội Sec","HNX"],["HUT","Tasco","HNX"],["VCG","Vinaconex","HNX"],
  ["IDC","IDICO","HNX"],["TNG","TNG Investment","HNX"],["LAS","LASCO","HNX"],
  ["VGC","Viglacera","HNX"],["PVB","PetroVietnam Ins","HNX"],["NTP","Nhựa Tiền Phong","HNX"],
  ["BBS","VICEM Bút Sơn","HNX"],["PPP","Đức Long Gia Lai","HNX"],
  ["HAN","Hanoi Securities","HNX"],["PGS","Saigon Petro","HNX"],
  ["VCF","Vinacafe Biên Hòa","HNX"],["HGM","Ha Giang Mineral","HNX"],
  ["SDT","Sông Đà 10","HNX"],["C47","CC47","HNX"],

  // ─── UPCOM ────────────────────────────────────────────────────
  ["BSB","BSB","UPCOM"],["VGT","Vinatex","UPCOM"],["MCH","Masan Consumer","UPCOM"],
  ["MML","Masan MEATLife","UPCOM"],["VEA","Veam","UPCOM"],["ACV","ACV","UPCOM"],
  ["MVB","Viet Bac Minerals","UPCOM"],["BSI","BVSC","UPCOM"],["CRE","Creditbank","UPCOM"],
  ["SGB","Saigonbank","UPCOM"],["NAB","Nam A Bank","UPCOM"],["KLB","Kiên Long Bank","UPCOM"],
  ["BVB","Bản Việt Bank","UPCOM"],["VIB","VIB","HOSE"],["BAB","Bắc Á Bank","UPCOM"],
  ["ABB","Abbank","UPCOM"],["PGB","Petrolimex Insurance","UPCOM"],
  ["QTP","Quảng Ninh Thermal","UPCOM"],["DTV","Đông Triều Mining","UPCOM"],
];

/* Build a lookup: ticker → {name, exchange} */
const STOCK_MAP = {};
STOCKS.forEach(([t,n,ex]) => { STOCK_MAP[t] = {name:n, exchange:ex}; });

/* Exchange mapping to TradingView prefix */
const EX_PREFIX = { HOSE: "HOSE", HNX: "HNX", UPCOM: "UPCOM" };

/* Quick-access tickers (shown as pills) */
const QUICK = ["VNM","VIC","HPG","TCB","VCB","FPT","MBB","SSI","VJC","GAS"];

/* ════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════ */
let currentSymbol = null;
let currentExFilter = "ALL";
let acIndex = -1;
let acItems = [];
let tvScriptLoaded = false;
let tvWidget = null;

/* ════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
  buildQuickList();
  setupSearch();
  setupExTabs();
});

/* ─── Quick pills ──────────────────────────────────────────── */
function buildQuickList() {
  const wrap = document.getElementById("quicklist");
  const lbl = document.createElement("span");
  lbl.className = "watch-label";
  lbl.textContent = "Phổ biến:";
  wrap.appendChild(lbl);

  QUICK.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "pill";
    btn.textContent = t;
    btn.dataset.ticker = t;
    btn.addEventListener("click", () => loadTicker(t));
    wrap.appendChild(btn);
  });
}

/* ─── Exchange tabs ────────────────────────────────────────── */
function setupExTabs() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentExFilter = btn.dataset.ex;
      // re-run autocomplete with current input
      showAutocomplete(document.getElementById("ticker-input").value);
    });
  });
}

/* ────────────────────────────────────────────────────────────────
   SEARCH & AUTOCOMPLETE
   ──────────────────────────────────────────────────────────────── */
function setupSearch() {
  const input = document.getElementById("ticker-input");
  const ac    = document.getElementById("autocomplete");

  input.addEventListener("input", () => {
    acIndex = -1;
    showAutocomplete(input.value);
  });

  input.addEventListener("keydown", e => {
    if (!acItems.length) {
      if (e.key === "Enter") {
        const v = input.value.trim().toUpperCase();
        if (v) tryLoadTicker(v);
      }
      return;
    }

    if (e.key === "ArrowDown") {
      e.preventDefault();
      acIndex = Math.min(acIndex + 1, acItems.length - 1);
      renderAcHighlight();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      acIndex = Math.max(acIndex - 1, -1);
      renderAcHighlight();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (acIndex >= 0) {
        selectAcItem(acItems[acIndex]);
      } else {
        const v = input.value.trim().toUpperCase();
        if (v) tryLoadTicker(v);
      }
    } else if (e.key === "Escape") {
      closeAc();
    }
  });

  document.addEventListener("click", e => {
    if (!document.getElementById("search-wrap").contains(e.target)) closeAc();
  });
}

function showAutocomplete(rawVal) {
  const val = rawVal.trim().toUpperCase();
  const ac  = document.getElementById("autocomplete");
  ac.innerHTML = "";
  acItems = [];
  acIndex = -1; // always reset on every refresh

  if (!val) { ac.style.display = "none"; return; }

  const filtered = STOCKS.filter(([t, n, ex]) => {
    const matchEx = currentExFilter === "ALL" || ex === currentExFilter;
    const matchQ  = t.startsWith(val) || n.toUpperCase().includes(val);
    return matchEx && matchQ;
  }).slice(0, 15);

  if (!filtered.length) { ac.style.display = "none"; return; }

  acItems = filtered;

  filtered.forEach(([t, n, ex], i) => {
    const item = document.createElement("div");
    item.className = "ac-item";
    item.dataset.idx = i;
    item.innerHTML = `
      <span class="ac-ticker">${t}</span>
      <span class="ac-name">${n}</span>
      <span class="ac-exchange">${ex}</span>
    `;
    item.addEventListener("mouseenter", () => { acIndex = i; renderAcHighlight(); });
    item.addEventListener("click", () => selectAcItem([t, n, ex]));
    ac.appendChild(item);
  });

  ac.style.display = "block";
}

function renderAcHighlight() {
  document.querySelectorAll(".ac-item").forEach((el, i) => {
    el.classList.toggle("active", i === acIndex);
  });
}

function selectAcItem(item) {
  if (!item) return;
  const [t] = item;
  document.getElementById("ticker-input").value = t;
  closeAc();
  loadTicker(t);
}

function closeAc() {
  document.getElementById("autocomplete").style.display = "none";
  acItems = [];
  acIndex = -1;
}

function tryLoadTicker(t) {
  /* allow any ticker even if not in list – just try it */
  closeAc();
  loadTicker(t);
}

/* ════════════════════════════════════════════════════════════════
   CHART – TradingView Advanced Widget
   ════════════════════════════════════════════════════════════════ */
function loadTicker(ticker) {
  ticker = ticker.toUpperCase().trim();
  if (!ticker) return;

  /* Determine exchange prefix:
     1. Known ticker → use its declared exchange
     2. Unknown ticker + exchange tab selected → use that tab
     3. Fallback → HOSE */
  const info = STOCK_MAP[ticker];
  let exchange;
  if (info) {
    exchange = EX_PREFIX[info.exchange];
  } else if (currentExFilter !== "ALL") {
    exchange = currentExFilter;
  } else {
    exchange = "HOSE";
  }
  const tvSymbol = `${exchange}:${ticker}`;

  currentSymbol = ticker;

  /* Update pills */
  document.querySelectorAll(".pill").forEach(p => {
    p.classList.toggle("active", p.dataset.ticker === ticker);
  });

  /* Status – built with DOM nodes to avoid XSS */
  const statusEl = document.getElementById("status-info");
  statusEl.textContent = "";
  const tickerSpan = document.createElement("span");
  tickerSpan.className = "status-ticker";
  tickerSpan.textContent = ticker;
  statusEl.appendChild(tickerSpan);
  if (info) {
    const detail = document.createTextNode(` · ${info.name} · ${info.exchange}`);
    statusEl.appendChild(detail);
  }

  /* Hide empty state */
  document.getElementById("empty-state").style.display = "none";

  /* Load / reload chart */
  loadTVWidget(tvSymbol);
}

function loadTVWidget(symbol) {
  const container = document.getElementById("tv-chart-container");
  container.innerHTML = ""; // clear previous

  /* Load TradingView script once */
  const render = () => {
    /* eslint-disable no-undef */
    new TradingView.widget({
      autosize: true,
      symbol: symbol,
      interval: "D",
      timezone: "Asia/Ho_Chi_Minh",
      theme: "dark",
      style: "1",
      locale: "vi_VN",
      toolbar_bg: "#161b22",
      enable_publishing: false,
      hide_top_toolbar: false,
      hide_legend: false,
      withdateranges: true,
      range: "12M",
      save_image: false,
      container_id: "tv-chart-container",
      studies: ["Volume@tv-basicstudies", "MACD@tv-basicstudies"],
      show_popup_button: false,
      popup_width: "1000",
      popup_height: "650",
      no_referral_id: true,
      allow_symbol_change: true,
    });
  };

  if (tvScriptLoaded) {
    render();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/tv.js";
  script.async = true;
  script.onload = () => {
    tvScriptLoaded = true;
    render();
  };
  script.onerror = () => {
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;
                  height:100%;color:var(--muted);flex-direction:column;gap:12px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Không tải được widget TradingView.</p>
        <small>Vui lòng kiểm tra kết nối internet.</small>
      </div>`;
  };
  document.head.appendChild(script);
}
</script>
</body>
</html>
