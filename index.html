<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VN Stock Chart – Biểu đồ chứng khoán Việt Nam</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#21262d;
      --accent:#2ecc71;--red:#e74c3c;--blue:#3498db;--orange:#e67e22;
      --text:#e6edf3;--muted:#8b949e;--shadow:0 4px 24px rgba(0,0,0,.5);
      --radius:7px;--font:'Inter','Segoe UI',system-ui,sans-serif}
    html,body{height:100%;background:var(--bg);color:var(--text);
      font-family:var(--font);font-size:14px;line-height:1.5}
    .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

    header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);
      border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:16px;white-space:nowrap}
    .logo-icon{width:26px;height:26px;background:var(--accent);border-radius:5px;
      display:flex;align-items:center;justify-content:center;font-size:14px}

    .search-wrap{position:relative;flex:1;max-width:460px}
    .search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    #q{width:100%;padding:7px 30px 7px 34px;background:var(--surface2);border:1px solid var(--border);
      border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--font);outline:none;
      transition:border-color .2s;text-transform:uppercase}
    #q::placeholder{color:var(--muted);text-transform:none}
    #q:focus{border-color:var(--accent)}
    #clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;
      color:var(--muted);cursor:pointer;display:none;font-size:13px;line-height:1}
    #clr:hover{color:var(--text)}

    #ac{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius);max-height:280px;overflow-y:auto;
      z-index:200;box-shadow:var(--shadow);display:none}
    .ac-hdr{padding:5px 12px 3px;font-size:10px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border)}
    .ac-row{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer;transition:background .12s}
    .ac-row:hover,.ac-row.sel{background:var(--surface2)}
    .ac-t{font-weight:700;font-size:13px;min-width:56px}
    .ac-n{color:var(--muted);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ac-ex,.ctb-ex{font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;flex-shrink:0}
    .ctb-ex{font-size:11px;padding:2px 6px;border-radius:4px}
    .ac-ex.HOSE,.ctb-ex.HOSE{background:rgba(46,204,113,.15);color:var(--accent)}
    .ac-ex.HNX,.ctb-ex.HNX{background:rgba(52,152,219,.15);color:var(--blue)}
    .ac-ex.UPCOM,.ctb-ex.UPCOM{background:rgba(230,126,34,.15);color:var(--orange)}

    .ex-tabs{display:flex;gap:3px}
    .ex-tab,.xbtn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;
      color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .xbtn{padding:3px 9px}
    .ex-tab:hover,.xbtn:hover{color:var(--text);border-color:var(--muted)}
    .ex-tab.on,.xbtn.on{color:#000;border-color:transparent}
    .ex-tab[data-ex=ALL].on{background:var(--muted)}
    .ex-tab[data-ex=HOSE].on,.xbtn[data-x=HOSE].on{background:var(--accent)}
    .ex-tab[data-ex=HNX].on,.xbtn[data-x=HNX].on{background:var(--blue)}
    .ex-tab[data-ex=UPCOM].on,.xbtn[data-x=UPCOM].on{background:var(--orange)}

    #cnt{font-size:11px;color:var(--muted);padding:3px 8px;border-radius:12px;
      border:1px solid var(--border);white-space:nowrap}
    #cnt.ok{border-color:rgba(46,204,113,.35);color:var(--accent)}

    .quick{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .qlbl{font-size:11px;color:var(--muted);white-space:nowrap}
    .qpill{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;
      color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .qpill:hover{border-color:var(--accent);color:var(--accent)}
    .qpill.on{background:rgba(46,204,113,.15);border-color:var(--accent);color:var(--accent)}

    #ctb{display:none;align-items:center;background:var(--surface);
      border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden}
    #ctb.vis{display:flex}
    .ctb-left{display:flex;align-items:center;gap:10px;padding:6px 14px;flex:1;flex-wrap:wrap;min-width:0}
    .ctb-sym{font-weight:700;font-size:14px}
    .ctb-nm{color:var(--muted);font-size:12px}
    .ctb-right{display:flex;align-items:center;gap:4px;padding:6px 14px;
      border-left:1px solid var(--border);flex-shrink:0}
    .ctb-lbl{font-size:11px;color:var(--muted);margin-right:2px}

    .range-bar{align-items:center;gap:4px;padding:5px 14px;background:var(--surface);
      border-bottom:1px solid var(--border);flex-shrink:0;display:none;flex-wrap:wrap;row-gap:6px}
    .range-bar.vis{display:flex}
    .rbtn,.resbtn{padding:3px 9px;border-radius:5px;border:1px solid transparent;background:transparent;
      color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
    .rbtn:hover,.resbtn:hover{color:var(--text)}
    .rbtn.on,.resbtn.on{background:var(--surface2);color:var(--text);border-color:var(--border)}
    .rb-sep{width:1px;height:16px;background:var(--border);margin:0 4px}
    .rb-right{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .ma-toggle{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;
      font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
    .ma-toggle.on{color:#000}
    #ma20-toggle{color:var(--blue)} #ma20-toggle.on{background:var(--blue);border-color:var(--blue)}
    #ma50-toggle{color:var(--orange)} #ma50-toggle.on{background:var(--orange);border-color:var(--orange)}

    .chart-area{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
    #chart{flex:1;min-height:0;position:relative}
    #vol-chart{height:0;flex-shrink:0;display:none}

    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:12px;color:var(--muted);pointer-events:none;z-index:10}
    .overlay.hidden{display:none}
    .overlay svg{opacity:.2}
    .spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err-msg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:var(--red);
      padding:10px 16px;border-radius:var(--radius);font-size:13px;max-width:380px;
      text-align:center;white-space:pre-line}

    .sbar{display:flex;align-items:center;gap:10px;padding:4px 16px;background:var(--surface);
      border-top:1px solid var(--border);flex-shrink:0;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .sbar a{color:var(--muted);text-decoration:none}
    .sbar a:hover{color:var(--text)}
    .sbar-r{margin-left:auto}
    #ohlc{display:flex;gap:12px;align-items:center;font-size:11px}
    .ohlc-lbl{color:var(--muted)}
    .ohlc-v{color:var(--text);font-weight:600}
    .ohlc-chg.up{color:var(--accent)} .ohlc-chg.dn{color:var(--red)}

    /* Ẩn dòng Tất cả/HOSE/HNX/UPCOM và dòng "Phổ biến" (giữ lại trong DOM để screener.js không bị lỗi) */
    .ex-tabs,.quick{display:none !important}

    /* ═══ ĐIỆN THOẠI: thu gọn các thanh phía trên để chừa chỗ cho đồ thị + 3 panel chỉ báo ═══ */
    @media (max-width:700px){
      html,body{font-size:13px}
      header{padding:6px 8px;gap:6px}
      .logo{font-size:0;gap:0}                      /* chỉ giữ icon, bỏ chữ "VN Chart" */
      .search-wrap{min-width:0;max-width:none}
      #q{padding:6px 26px 6px 30px;font-size:13px}
      #cnt{display:none}
      #ctb{flex-wrap:nowrap}
      .ctb-left{flex-wrap:nowrap;gap:6px;padding:4px 8px;overflow:hidden}
      .ctb-sym{font-size:13px}
      .ctb-nm,.ctb-ex,.ctb-right .ctb-lbl{display:none}
      .ctb-right{padding:4px 8px;gap:3px}
      .xbtn{padding:2px 7px}
      .range-bar{flex-wrap:nowrap;overflow-x:auto;padding:4px 8px;row-gap:0;scrollbar-width:none}
      .range-bar::-webkit-scrollbar{display:none}
      .range-bar > *{flex-shrink:0}
      .rb-right{margin-left:8px;flex-wrap:nowrap}
      .rb-right > *{flex-shrink:0}
      .rbtn,.resbtn{padding:3px 7px}
      .sbar{padding:2px 8px;font-size:10px;gap:6px}
      .sbar-r,#dataSource{display:none}
    }

    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo"><div class="logo-icon">📈</div>VN Chart</div>

    <div class="search-wrap" id="sw">
      <svg class="search-ico" width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" placeholder="Tìm mã CK hoặc tên công ty..." autocomplete="off" spellcheck="false"/>
      <button id="clr">✕</button>
      <div id="ac"></div>
    </div>

    <div class="ex-tabs">
      <button class="ex-tab on" data-ex="ALL">Tất cả</button>
      <button class="ex-tab" data-ex="HOSE">HOSE</button>
      <button class="ex-tab" data-ex="HNX">HNX</button>
      <button class="ex-tab" data-ex="UPCOM">UPCOM</button>
    </div>

    <span id="cnt">Đang tải...</span>
    <!-- Nút "🔎 Lọc" và panel bộ lọc do screener.js tự thêm vào -->

    <div class="quick" id="qlist"></div>
  </header>

  <div id="ctb">
    <div class="ctb-left">
      <span class="ctb-sym" id="ctb-sym"></span>
      <span class="ctb-nm"  id="ctb-nm"></span>
      <span class="ctb-ex"  id="ctb-ex"></span>
    </div>
    <div class="ctb-right">
      <span class="ctb-lbl">Đổi sàn:</span>
      <button class="xbtn" data-x="HOSE">HOSE</button>
      <button class="xbtn" data-x="HNX">HNX</button>
      <button class="xbtn" data-x="UPCOM">UPCOM</button>
    </div>
  </div>

  <div class="range-bar" id="rbar">
    <button class="rbtn" data-r="7">1T</button>
    <button class="rbtn" data-r="30">1M</button>
    <button class="rbtn" data-r="90">3M</button>
    <button class="rbtn on" data-r="365">1N</button>
    <button class="rbtn" data-r="1095">3N</button>
    <button class="rbtn" data-r="3650">10N</button>
    <button class="rbtn" data-r="0">Tất cả</button>
    <div class="rb-sep"></div>
    <button class="resbtn on" data-res="D">Ngày</button>
    <button class="resbtn" data-res="W">Tuần</button>
    <button class="resbtn" data-res="M">Tháng</button>
    <div class="rb-right">
      <span class="ctb-lbl">MA:</span>
      <button class="ma-toggle" id="ma20-toggle" data-ma="20">MA20</button>
      <button class="ma-toggle" id="ma50-toggle" data-ma="50">MA50</button>
    </div>
  </div>

  <div class="chart-area" id="chart-area">
    <div id="chart"></div>
    <div id="vol-chart"></div>
    <!-- 3 panel chỉ báo (Vortex Oscillator, AIR Vortex ADX, Klinger) do indicators.js tự tạo ngay dưới #vol-chart -->

    <div class="overlay" id="empty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <p>Nhập mã chứng khoán để xem biểu đồ</p>
      <small id="empty-hint">Đang tải danh sách...</small>
    </div>
    <div class="overlay hidden" id="loading">
      <div class="spin"></div>
      <span style="color:var(--muted);font-size:13px">Đang tải dữ liệu...</span>
    </div>
    <div class="overlay hidden" id="errmsg"><div class="err-msg" id="err-txt"></div></div>
  </div>

  <div class="sbar">
    <div id="ohlc" style="display:none">
      <span class="ohlc-lbl">O</span><span class="ohlc-v" id="ov-o">—</span>
      <span class="ohlc-lbl">H</span><span class="ohlc-v" id="ov-h">—</span>
      <span class="ohlc-lbl">L</span><span class="ohlc-v" id="ov-l">—</span>
      <span class="ohlc-lbl">C</span><span class="ohlc-v" id="ov-c">—</span>
      <span class="ohlc-chg" id="ov-chg"></span>
    </div>
    <span id="dataSource">Dữ liệu: — · Biểu đồ: <a href="https://tradingview.com/lightweight-charts/" target="_blank">Lightweight Charts</a></span>
    <span class="sbar-r">HOSE · HNX · UPCOM &nbsp;·&nbsp; © VN Chart 2025 · Chỉ mang tính tham khảo, không phải khuyến nghị đầu tư</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
/* ═══ CONFIG ═══ */
const QUICK = ["VNM","VIC","HPG","TCB","VCB","FPT","MBB","SSI","VJC","GAS"];

const FMT_PRICE = v => v == null ? '—' : v.toLocaleString('vi-VN');
const FMT_VOL   = v => {
  if (!v) return '—';
  if (v >= 1e9) return (v/1e9).toFixed(2) + ' tỷ';
  if (v >= 1e6) return (v/1e6).toFixed(2) + ' tr';
  if (v >= 1e3) return (v/1e3).toFixed(1) + ' k';
  return String(v);
};

/* ═══ STATE ═══ */
let STOCKS = [], SMAP = {};
let exFilter = 'ALL';
let acItems = [], acIdx = -1;
let curTicker = null, curExchange = null;
let rangeDays = 365, resolution = 'D';
let ma20On = false, ma50On = false;
let lastCandles = null, reqId = 0;
let mainChart = null, volChart = null;
let candleSeries = null, volSeries = null, ma20Series = null, ma50Series = null;

/* ═══ BOOT ═══ */
document.addEventListener('DOMContentLoaded', async () => {
  buildQuickList(); setupSearch(); setupExTabs(); setupToolbar(); setupRangeBar(); setupMA();
  initCharts();
  updateCount('Đang tải…', false);
  // fetchTickerList() do screener.js định nghĩa (đọc data/screener.json)
  try { await fetchTickerList(); }
  catch (e) { console.warn('Không tải được danh sách mã:', e); loadFallback(); }
});

/* ═══ DANH SÁCH MÃ DỰ PHÒNG (khi thiếu data/screener.json) ═══ */
const FALLBACK_STOCKS = [
  ["ACB","Á Châu"],["BID","BIDV"],["BVH","Bảo Việt"],["CTG","VietinBank"],["DGC","Hóa chất Đức Giang"],
  ["FPT","Tập đoàn FPT"],["GAS","PV Gas"],["GVR","Cao su Việt Nam"],["HDB","HDBank"],["HPG","Hòa Phát"],
  ["MBB","MB Bank"],["MSN","Masan Group"],["MWG","Mobile World"],["PLX","Petrolimex"],["PNJ","PNJ"],
  ["POW","PV Power"],["REE","REE Corp"],["SAB","Sabeco"],["SHB","SHBank"],["SSI","SSI"],
  ["STB","Sacombank"],["TCB","Techcombank"],["TPB","TPBank"],["VCB","Vietcombank"],["VHM","Vinhomes"],
  ["VIB","VIB"],["VIC","Vingroup"],["VJC","Vietjet"],["VNM","Vinamilk"],["VPB","VPBank"],
].map(([t, n]) => [t, n, 'HOSE']);

function loadFallback() {
  STOCKS = FALLBACK_STOCKS;
  buildMap();
  updateCount(`${STOCKS.length} mã (dự phòng)`, true);
  document.getElementById('empty-hint').textContent = 'Danh sách đầy đủ chưa tải được – đang dùng danh sách rút gọn';
}
function buildMap() { SMAP = {}; STOCKS.forEach(([t,n,ex]) => { SMAP[t] = {name:n, exchange:ex}; }); }
function updateCount(t, ok) {
  const el = document.getElementById('cnt'); el.textContent = t; el.classList.toggle('ok', ok);
}

/* ═══ CHART INIT ═══ */
function initCharts() {
  if (typeof LightweightCharts === 'undefined') {
    showState('error', 'Không tải được thư viện biểu đồ (CDN).\nKiểm tra mạng rồi tải lại trang.');
    return;
  }
  const COMMON = {
    layout: { background:{type:'solid',color:'#0d1117'}, textColor:'#8b949e' },
    grid:   { vertLines:{color:'#161b22'}, horzLines:{color:'#161b22'} },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { borderColor:'#21262d', timeVisible:true, secondsVisible:false },
    rightPriceScale: { borderColor:'#21262d' },
    handleScale:{ mouseWheel:true, pinch:true },
    handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true },
  };
  const cEl = document.getElementById('chart'), vEl = document.getElementById('vol-chart');

  mainChart = LightweightCharts.createChart(cEl, { ...COMMON, autoSize:true });
  volChart  = LightweightCharts.createChart(vEl, {
    ...COMMON, autoSize:true,
    rightPriceScale:{ visible:false, borderColor:'#21262d' },
    leftPriceScale: { visible:false },
    timeScale:{ visible:false, borderColor:'#21262d' },
    crosshair:{ vertLine:{visible:true}, horzLine:{visible:false} },
  });
  candleSeries = mainChart.addCandlestickSeries({
    upColor:'#2ecc71', downColor:'#e74c3c', borderUpColor:'#2ecc71', borderDownColor:'#e74c3c',
    wickUpColor:'#2ecc71', wickDownColor:'#e74c3c',
  });
  volSeries = volChart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'' });
  volChart.priceScale('').applyOptions({ scaleMargins:{top:0.1, bottom:0} });

  let syncing = false;
  mainChart.subscribeCrosshairMove(p => {
    if (!syncing) {
      syncing = true;
      volChart.setCrosshairPosition(p.seriesData?.get(candleSeries)?.close ?? 0, p.time ?? null, volSeries);
      syncing = false;
    }
    const bar = p.seriesData?.get(candleSeries);
    if (!bar) return;
    const prev = candleSeries.dataByIndex(p.logical - 1);
    const chg = prev ? ((bar.close - prev.close) / prev.close * 100) : 0;
    document.getElementById('ov-o').textContent = FMT_PRICE(bar.open);
    document.getElementById('ov-h').textContent = FMT_PRICE(bar.high);
    document.getElementById('ov-l').textContent = FMT_PRICE(bar.low);
    document.getElementById('ov-c').textContent = FMT_PRICE(bar.close);
    const chgEl = document.getElementById('ov-chg');
    chgEl.textContent = (chg>=0?'+':'') + chg.toFixed(2) + '%';
    chgEl.className = 'ohlc-chg ' + (chg>=0 ? 'up' : 'dn');
  });
  mainChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return; syncing = true; volChart.timeScale().setVisibleLogicalRange(r); syncing = false;
  });
  volChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return; syncing = true; mainChart.timeScale().setVisibleLogicalRange(r); syncing = false;
  });
  window.addEventListener('resize', () => {
    mainChart.applyOptions({ width: cEl.offsetWidth });
    volChart.applyOptions({ width: vEl.offsetWidth });
  });
}

/* ═══ DATA ═══ */
function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal })
    .then(r => { clearTimeout(tid); return r; })
    .catch(e => { clearTimeout(tid); throw e; });
}

async function loadLocal(ticker) {
  const res = await fetchWithTimeout(`data/${encodeURIComponent(ticker)}.json`, 8000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const txt = (await res.text()).replace(/\bNaN\b/g, 'null').replace(/-?Infinity\b/g, 'null');
  return JSON.parse(txt);
}

async function loadChartData() {
  if (!curTicker) return;
  const my = ++reqId, tk = curTicker;       // bỏ qua kết quả cũ nếu người dùng đã chọn mã khác
  showState('loading');
  const from = rangeDays > 0 ? Math.floor(Date.now()/1000) - rangeDays * 86400 : 0;

  let candles = null, fullCandles = null, err = '';
  try {
    const json = await loadLocal(tk);
    candles     = parseLocalFile(json, from, resolution);
    fullCandles = parseLocalFile(json, 0,    resolution);   // toàn bộ lịch sử → dùng để tính chỉ báo
  }
  catch (e) { err = e.message; console.warn('[VNChart]', tk, e); }
  if (my !== reqId) return;

  if (!candles) {
    showState('error', `Không có dữ liệu cho mã "${tk}" (${err || 'file rỗng'}).\n` +
                       `Kiểm tra file data/${tk}.json và GitHub Actions.`);
    return;
  }
  document.getElementById('dataSource').innerHTML =
    'Dữ liệu: Yahoo Finance (cập nhật hằng ngày, có thể trễ) · Biểu đồ: ' +
    '<a href="https://tradingview.com/lightweight-charts/" target="_blank">Lightweight Charts</a>';

  candleSeries.setData(candles);
  volSeries.setData(candles.map(c => ({
    time: c.time, value: c.volume,
    color: c.close >= c.open ? 'rgba(46,204,113,.5)' : 'rgba(231,76,60,.5)',
  })));
  lastCandles = candles;
  renderMA(candles);
  if (typeof renderIndicators === 'function') renderIndicators(candles, fullCandles || candles);
  mainChart.timeScale().fitContent();
  showState('chart');
  document.getElementById('ohlc').style.display = 'flex';
}

function parseLocalFile(json, fromTs, res) {
  const raw = Array.isArray(json) ? json : json?.candles;
  if (!Array.isArray(raw) || raw.length < 2) return null;

  const rows = raw.map(row => {
    const [d, o, h, l, c, v] = row;
    if (o == null || h == null || l == null || c == null) return null;
    const ts = typeof d === 'number' ? d : dateToTime(d);
    const ov=+o, hv=+h, lv=+l, cv=+c, vv=+v;
    if (!ts || !isFinite(ov) || !isFinite(hv) || !isFinite(lv) || !isFinite(cv) ||
        ov<=0 || hv<=0 || lv<=0 || cv<=0) return null;
    return [ts, ov, hv, lv, cv, isFinite(vv) && vv > 0 ? vv : 0];
  }).filter(Boolean).sort((a,b) => a[0] - b[0]);
  if (rows.length < 2) return null;

  let filtered = rows.filter(([ts]) => ts >= fromTs);
  if (!filtered.length) filtered = rows;

  if (res === 'D')
    return filtered.map(([ts,o,h,l,c,v]) => ({ time:ts, open:o, high:h, low:l, close:c, volume:v }));

  const bucketKey = ts => {
    const d = new Date(ts * 1000);
    if (res === 'W') { const day = d.getUTCDay(); return ts - (day === 0 ? 6 : day - 1) * 86400; }
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000;
  };
  const map = new Map();
  for (const [ts,o,h,l,c,v] of filtered) {
    const k = bucketKey(ts);
    if (!map.has(k)) map.set(k, { time:k, open:o, high:h, low:l, close:c, volume:v });
    else { const b = map.get(k); b.high = Math.max(b.high,h); b.low = Math.min(b.low,l); b.close = c; b.volume += v; }
  }
  const agg = [...map.values()].sort((a,b) => a.time - b.time);
  return agg.length >= 2 ? agg : null;
}

function dateToTime(s) {
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? Math.floor(new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00Z`).getTime() / 1000) : null;
}

function calcMA(data, n) {
  const out = [];
  for (let i = n-1; i < data.length; i++)
    out.push({ time: data[i].time, value: data.slice(i-n+1, i+1).reduce((a,c) => a + c.close, 0) / n });
  return out;
}
function renderMA(data) {
  if (!ma20Series) ma20Series = mainChart.addLineSeries({ color:'#3498db', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  if (!ma50Series) ma50Series = mainChart.addLineSeries({ color:'#e67e22', lineWidth:1, priceLineVisible:false, lastValueVisible:false });
  ma20Series.setData(ma20On && data.length >= 20 ? calcMA(data,20) : []);
  ma50Series.setData(ma50On && data.length >= 50 ? calcMA(data,50) : []);
}

/* ═══ UI ═══ */
function showState(state, msg) {
  document.getElementById('empty').classList.toggle('hidden',   state !== 'empty');
  document.getElementById('loading').classList.toggle('hidden', state !== 'loading');
  document.getElementById('errmsg').classList.toggle('hidden',  state !== 'error');
  if (state === 'error' && msg) document.getElementById('err-txt').textContent = msg;
}

function loadTicker(ticker, forceEx) {
  ticker = ticker.toUpperCase().trim();
  if (!ticker) return;
  const info = SMAP[ticker];
  const exchange = forceEx || (info ? info.exchange : (exFilter !== 'ALL' ? exFilter : 'HOSE'));
  curTicker = ticker; curExchange = exchange;

  document.querySelectorAll('.qpill').forEach(p => p.classList.toggle('on', p.dataset.t === ticker));
  document.getElementById('ctb').classList.add('vis');
  document.getElementById('ctb-sym').textContent = ticker;
  document.getElementById('ctb-nm').textContent  = info?.name ?? '';
  const exEl = document.getElementById('ctb-ex');
  exEl.textContent = exchange; exEl.className = `ctb-ex ${exchange}`;
  document.querySelectorAll('.xbtn').forEach(b => b.classList.toggle('on', b.dataset.x === exchange));
  document.getElementById('rbar').classList.add('vis');
  loadChartData();
}

function buildQuickList() {
  const wrap = document.getElementById('qlist');
  const lbl = document.createElement('span'); lbl.className = 'qlbl'; lbl.textContent = 'Phổ biến:';
  wrap.appendChild(lbl);
  QUICK.forEach(t => {
    const b = document.createElement('button');
    b.className = 'qpill'; b.textContent = t; b.dataset.t = t;
    b.addEventListener('click', () => loadTicker(t));
    wrap.appendChild(b);
  });
}

function setupExTabs() {
  document.querySelectorAll('.ex-tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.ex-tab').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    exFilter = btn.dataset.ex; acIdx = -1;
    showAC(document.getElementById('q').value);
  }));
}
function setupToolbar() {
  document.querySelectorAll('.xbtn').forEach(btn => btn.addEventListener('click', () => {
    if (curTicker) loadTicker(curTicker, btn.dataset.x);
  }));
}
function setupRangeBar() {
  document.querySelectorAll('.rbtn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.rbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on'); rangeDays = parseInt(btn.dataset.r);
    if (curTicker) loadChartData();
  }));
  document.querySelectorAll('.resbtn').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.resbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on'); resolution = btn.dataset.res;
    if (curTicker) loadChartData();
  }));
}
function setupMA() {
  ['20','50'].forEach(n => document.getElementById(`ma${n}-toggle`).addEventListener('click', e => {
    e.currentTarget.classList.toggle('on');
    if (n === '20') ma20On = !ma20On; else ma50On = !ma50On;
    if (curTicker) { if (lastCandles?.length) renderMA(lastCandles); else loadChartData(); }
  }));
}

/* ═══ SEARCH ═══ */
function setupSearch() {
  const inp = document.getElementById('q'), clr = document.getElementById('clr');
  inp.addEventListener('input', () => {
    acIdx = -1; clr.style.display = inp.value ? 'block' : 'none'; showAC(inp.value);
  });
  clr.addEventListener('click', () => { inp.value = ''; clr.style.display = 'none'; closeAC(); inp.focus(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx+1, acItems.length-1); highlightAC(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, -1); highlightAC(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (acIdx >= 0 && acItems[acIdx]) pickAC(acItems[acIdx]);
      else { const v = inp.value.trim().toUpperCase(); if (v) { closeAC(); loadTicker(v); } }
    } else if (e.key === 'Escape') closeAC();
  });
  document.addEventListener('click', e => { if (!document.getElementById('sw').contains(e.target)) closeAC(); });
}

function showAC(raw) {
  const val = raw.trim().toUpperCase();
  const el = document.getElementById('ac');
  el.innerHTML = ''; acItems = []; acIdx = -1;
  if (!val || !STOCKS.length) { el.style.display = 'none'; return; }

  const exact = [], starts = [], name = [];
  STOCKS.forEach(item => {
    const [t,n,ex] = item;
    if (exFilter !== 'ALL' && ex !== exFilter) return;
    if (t === val) exact.push(item);
    else if (t.startsWith(val)) starts.push(item);
    else if (n.toUpperCase().includes(val)) name.push(item);
  });
  const merged = [...exact, ...starts, ...name].slice(0, 20);
  if (!merged.length) { el.style.display = 'none'; return; }
  acItems = merged;

  const grp = (label, items) => {
    if (!items.length) return;
    const hdr = document.createElement('div'); hdr.className = 'ac-hdr'; hdr.textContent = label;
    el.appendChild(hdr);
    items.forEach(item => {
      const [t,n,ex] = item;
      const row = document.createElement('div'); row.className = 'ac-row'; row.dataset.t = t;
      const ts = document.createElement('span'); ts.className = 'ac-t'; ts.textContent = t;
      const ns = document.createElement('span'); ns.className = 'ac-n'; ns.textContent = n;
      const es = document.createElement('span'); es.className = `ac-ex ${ex}`; es.textContent = ex;
      row.append(ts, ns, es);
      row.addEventListener('mouseenter', () => { acIdx = acItems.indexOf(item); highlightAC(); });
      row.addEventListener('click', () => pickAC(item));
      el.appendChild(row);
    });
  };
  grp('Khớp chính xác', exact.slice(0,3));
  grp('Mã bắt đầu bằng', starts.slice(0,10));
  grp('Theo tên công ty', name.slice(0,8));
  el.style.display = 'block';
}
function highlightAC() {
  document.querySelectorAll('.ac-row').forEach(r => r.classList.toggle('sel', r.dataset.t === acItems[acIdx]?.[0]));
}
function pickAC(item) {
  if (!item) return;
  document.getElementById('q').value = item[0];
  document.getElementById('clr').style.display = 'block';
  closeAC(); loadTicker(item[0]);
}
function closeAC() { document.getElementById('ac').style.display = 'none'; acItems = []; acIdx = -1; }
</script>
