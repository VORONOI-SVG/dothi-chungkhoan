<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>VN Stock Chart – Biểu đồ chứng khoán Việt Nam</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #21262d;
      --accent:   #2ecc71;
      --red:      #e74c3c;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --input-bg: #1c2128;
      --shadow:   0 4px 24px rgba(0,0,0,.5);
      --radius:   8px;
      --font:     'Inter','Segoe UI',system-ui,sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text);
                 font-family: var(--font); font-size: 14px; line-height: 1.5; }

    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 18px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }

    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700;
            font-size: 17px; letter-spacing: -.3px; white-space: nowrap; }
    .logo-icon { width: 28px; height: 28px; background: var(--accent);
                 border-radius: 6px; display: flex; align-items: center;
                 justify-content: center; font-size: 15px; }

    /* ── Search ──────────────────────────────────────────── */
    .search-wrap { position: relative; flex: 1; max-width: 500px; }
    .search-icon { position: absolute; left: 11px; top: 50%;
                   transform: translateY(-50%); color: var(--muted);
                   pointer-events: none; }

    #ticker-input {
      width: 100%; padding: 8px 36px 8px 36px;
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 14px; font-family: var(--font); outline: none;
      transition: border-color .2s; text-transform: uppercase;
    }
    #ticker-input::placeholder { color: var(--muted); text-transform: none; }
    #ticker-input:focus { border-color: var(--accent); }

    #clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      display: none; padding: 2px; line-height: 1;
    }
    #clear-btn:hover { color: var(--text); }

    /* ── Autocomplete ───────────────────────────────────── */
    #autocomplete {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); max-height: 300px; overflow-y: auto;
      z-index: 200; box-shadow: var(--shadow); display: none;
    }
    #autocomplete::-webkit-scrollbar { width: 4px; }
    #autocomplete::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .ac-item { display: flex; align-items: center; gap: 10px;
               padding: 8px 14px; cursor: pointer; transition: background .12s; }
    .ac-item:hover, .ac-item.active { background: var(--input-bg); }
    .ac-ticker { font-weight: 700; font-size: 13px; min-width: 60px; color: var(--text); }
    .ac-name   { color: var(--muted); font-size: 12px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ac-ex     { margin-left: auto; font-size: 10px; font-weight: 700;
                 padding: 2px 6px; border-radius: 4px;
                 background: var(--border); color: var(--muted); flex-shrink: 0; }
    .ac-ex.hose  { background: rgba(46,204,113,.15); color: var(--accent); }
    .ac-ex.hnx   { background: rgba(52,152,219,.15); color: #3498db; }
    .ac-ex.upcom { background: rgba(230,126,34,.15); color: #e67e22; }

    .ac-header { padding: 6px 14px 4px; font-size: 10px; font-weight: 700;
                 color: var(--muted); text-transform: uppercase;
                 letter-spacing: .8px; border-bottom: 1px solid var(--border); }

    /* ── Exchange tabs ───────────────────────────────────── */
    .exchange-tabs { display: flex; gap: 4px; align-items: center; }
    .tab-btn {
      padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--muted); }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

    /* ── Quick pills ─────────────────────────────────────── */
    .watchlist { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .watch-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .pill {
      padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all .15s;
    }
    .pill:hover  { border-color: var(--accent); color: var(--accent); }
    .pill.active { background: rgba(46,204,113,.15); border-color: var(--accent); color: var(--accent); }

    /* ── Stock count badge ───────────────────────────────── */
    #stock-count {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border);
    }
    #stock-count.loaded { border-color: rgba(46,204,113,.3); color: var(--accent); }

    /* ── Chart ───────────────────────────────────────────── */
    .chart-container { flex: 1; min-height: 0; position: relative; }
    #tv-chart-container { width: 100%; height: 100%; }

    /* ── Empty state ─────────────────────────────────────── */
    .empty-state {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: var(--muted); pointer-events: none;
    }
    .empty-state svg { opacity: .2; }
    .empty-state p   { font-size: 16px; }
    .empty-state small { font-size: 12px; }

    /* ── Spinner ─────────────────────────────────────────── */
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status bar ──────────────────────────────────────── */
    .status-bar {
      display: flex; align-items: center; gap: 12px; padding: 5px 18px;
      background: var(--surface); border-top: 1px solid var(--border);
      flex-shrink: 0; font-size: 11px; color: var(--muted); flex-wrap: wrap;
    }
    .status-bar a { color: var(--muted); text-decoration: none; }
    .status-bar a:hover { color: var(--text); }
    .status-ticker { font-weight: 700; color: var(--text); font-size: 12px; }
    .status-right { margin-left: auto; }

    /* ── Chart toolbar (exchange switcher) ──────────────── */
    #chart-toolbar {
      display: none; align-items: center; gap: 10px;
      padding: 6px 18px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; font-size: 12px;
    }
    #chart-toolbar.visible { display: flex; }
    .ct-symbol { font-weight: 700; color: var(--text); font-size: 13px; }
    .ct-name   { color: var(--muted); }
    .ct-sep    { color: var(--border); margin: 0 2px; }
    .ct-hint   { color: var(--muted); font-size: 11px; }
    .ex-switch { display: flex; gap: 4px; align-items: center; margin-left: 6px; }
    .ex-switch-label { color: var(--muted); font-size: 11px; }
    .ex-btn {
      padding: 3px 10px; border-radius: 5px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all .15s;
    }
    .ex-btn:hover { border-color: var(--muted); color: var(--text); }
    .ex-btn.active { color: #000; border-color: transparent; }
    .ex-btn[data-ex="HOSE"].active  { background: var(--accent); }
    .ex-btn[data-ex="HNX"].active   { background: #3498db; }
    .ex-btn[data-ex="UPCOM"].active { background: #e67e22; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>

/* ════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════ */
let STOCKS   = [];           // full list (from API or fallback)
let STOCK_MAP = {};           // ticker → {name, exchange}
let currentExFilter = "ALL";
let acIndex = -1;
let acItems = [];
let tvScriptLoaded = false;

const QUICK = ["VNM","VIC","HPG","TCB","VCB","FPT","MBB","SSI","VJC","GAS"];

/* ════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", async () => {
  buildQuickList();
  setupSearch();
  setupExTabs();
  setupChartToolbar();
  updateCount("Đang tải...", false);

  try {
    await fetchStocksFromAPI();
  } catch (e) {
    loadFallback();
  }
});

/* ─── Load fallback ──────────────────────────────────── */
function loadFallback() {
  STOCKS = FALLBACK;
  buildMap();
  const n = STOCKS.length;
  updateCount(`${n} mã (offline)`, true);
  document.getElementById("empty-hint").textContent =
    `Hỗ trợ ${n} mã HOSE · HNX · UPCOM`;
}

/* ─── Fetch from SSI iBoard API (no auth needed) ─────── */
async function fetchStocksFromAPI() {
  // Try multiple public endpoints in order
  const apis = [
    {
      url: "https://iboard-query.ssi.com.vn/v2/stock-price/symbols-list?exchange=ALL&type=stock",
      parse: parseSSI
    },
    {
      url: "https://apipubaws.tcbs.com.vn/stock-insight/v2/stock/ticker?locale=vi&page=0&size=2000",
      parse: parseTCBS
    }
  ];

  for (const api of apis) {
    try {
      const res = await fetch(api.url, {
        headers: { "Accept": "application/json" },
        signal: AbortSignal.timeout(6000)
      });
      if (!res.ok) continue;
      const json = await res.json();
      const stocks = api.parse(json);
      if (stocks && stocks.length > 100) {
        STOCKS = stocks;
        buildMap();
        const n = STOCKS.length;
        updateCount(`${n} mã`, true);
        document.getElementById("empty-hint").textContent =
          `Hỗ trợ ${n}+ mã HOSE · HNX · UPCOM`;
        return;
      }
    } catch (_) { /* try next */ }
  }
  throw new Error("All APIs failed");
}

/* ─── Parsers ────────────────────────────────────────── */
function parseSSI(json) {
  // SSI returns: { data: [ { symbol, exchange, companyName }, ... ] }
  const rows = json?.data || json?.items || [];
  if (!rows.length) return null;
  return rows.map(r => {
    const ex = normalizeExchange(r.exchange || r.exchangeId || r.floorCode || "");
    return [r.symbol || r.ticker, r.companyName || r.name || r.symbol, ex];
  }).filter(([t,,ex]) => t && ex);
}

function parseTCBS(json) {
  // TCBS returns: { data: [ { ticker, organName, exchange }, ... ] }
  const rows = json?.data || [];
  if (!rows.length) return null;
  return rows.map(r => {
    const ex = normalizeExchange(r.exchange || "");
    return [r.ticker, r.organName || r.shortName || r.ticker, ex];
  }).filter(([t,,ex]) => t && ex);
}

function normalizeExchange(raw) {
  const s = (raw || "").toUpperCase();
  if (s.includes("HOSE") || s === "HSX" || s === "HCM" || s === "HSTC") return "HOSE";
  if (s.includes("HNX") || s === "HNX" || s === "HASTC") return "HNX";
  if (s.includes("UPCOM") || s === "UPC") return "UPCOM";
  return null;
}

function buildMap() {
  STOCK_MAP = {};
  STOCKS.forEach(([t, n, ex]) => { STOCK_MAP[t] = { name: n, exchange: ex }; });
}

/* ─── Count badge ────────────────────────────────────── */
function updateCount(text, loaded) {
  const el = document.getElementById("stock-count");
  el.textContent = text;
  el.classList.toggle("loaded", loaded);
}

/* ════════════════════════════════════════════════════════
   QUICK LIST
   ════════════════════════════════════════════════════════ */
function buildQuickList() {
  const wrap = document.getElementById("quicklist");
  const lbl = document.createElement("span");
  lbl.className = "watch-label";
  lbl.textContent = "Phổ biến:";
  wrap.appendChild(lbl);
  QUICK.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "pill"; btn.textContent = t; btn.dataset.ticker = t;
    btn.addEventListener("click", () => loadTicker(t));
    wrap.appendChild(btn);
  });
}

/* ════════════════════════════════════════════════════════
   EXCHANGE TABS
   ════════════════════════════════════════════════════════ */
function setupExTabs() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentExFilter = btn.dataset.ex;
      acIndex = -1;
      showAutocomplete(document.getElementById("ticker-input").value);
    });
  });
}

/* ════════════════════════════════════════════════════════
   SEARCH & AUTOCOMPLETE
   ════════════════════════════════════════════════════════ */
function setupSearch() {
  const input = document.getElementById("ticker-input");
  const clearBtn = document.getElementById("clear-btn");

  input.addEventListener("input", () => {
    acIndex = -1;
    clearBtn.style.display = input.value ? "block" : "none";
    showAutocomplete(input.value);
  });

  clearBtn.addEventListener("click", () => {
    input.value = "";
    clearBtn.style.display = "none";
    closeAc();
    input.focus();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      acIndex = Math.min(acIndex + 1, acItems.length - 1);
      renderAcHighlight();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      acIndex = Math.max(acIndex - 1, -1);
      renderAcHighlight();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (acIndex >= 0 && acItems[acIndex]) {
        selectAcItem(acItems[acIndex]);
      } else {
        const v = input.value.trim().toUpperCase();
        if (v) tryLoadTicker(v);
      }
    } else if (e.key === "Escape") {
      closeAc();
    }
  });

  document.addEventListener("click", e => {
    if (!document.getElementById("search-wrap").contains(e.target)) closeAc();
  });
}

function showAutocomplete(rawVal) {
  const val = rawVal.trim().toUpperCase();
  const ac = document.getElementById("autocomplete");
  ac.innerHTML = ""; acItems = []; acIndex = -1;

  if (!val) { ac.style.display = "none"; return; }
  if (!STOCKS.length) { ac.style.display = "none"; return; }

  const exactMatch = [], startsWith = [], contains = [];

  STOCKS.forEach(item => {
    const [t, n, ex] = item;
    if (currentExFilter !== "ALL" && ex !== currentExFilter) return;
    if (t === val)                              exactMatch.push(item);
    else if (t.startsWith(val))                startsWith.push(item);
    else if (n.toUpperCase().includes(val))    contains.push(item);
  });

  const merged = [...exactMatch, ...startsWith, ...contains].slice(0, 20);
  if (!merged.length) { ac.style.display = "none"; return; }
  acItems = merged;

  if (exactMatch.length)  appendAcGroup(ac, "Khớp chính xác", exactMatch.slice(0,3));
  if (startsWith.length)  appendAcGroup(ac, "Mã bắt đầu bằng", startsWith.slice(0,10));
  if (contains.length)    appendAcGroup(ac, "Theo tên công ty", contains.slice(0,8));

  ac.style.display = "block";
}

function appendAcGroup(container, label, items) {
  if (!items.length) return;
  const hdr = document.createElement("div");
  hdr.className = "ac-header"; hdr.textContent = label;
  container.appendChild(hdr);

  items.forEach(item => {
    const [t, n, ex] = item;
    const div = document.createElement("div");
    div.className = "ac-item";
    div.dataset.ticker = t;

    const tickerEl = document.createElement("span"); tickerEl.className = "ac-ticker"; tickerEl.textContent = t;
    const nameEl   = document.createElement("span"); nameEl.className   = "ac-name";   nameEl.textContent   = n;
    const exEl     = document.createElement("span");
    exEl.className = `ac-ex ${ex.toLowerCase()}`; exEl.textContent = ex;

    div.append(tickerEl, nameEl, exEl);
    div.addEventListener("mouseenter", () => {
      acIndex = acItems.indexOf(item);
      renderAcHighlight();
    });
    div.addEventListener("click", () => selectAcItem(item));
    container.appendChild(div);
  });
}

function renderAcHighlight() {
  const all = document.querySelectorAll(".ac-item");
  all.forEach(el => {
    const idx = acItems.findIndex(i => i[0] === el.dataset.ticker);
    el.classList.toggle("active", idx === acIndex);
  });
}

function selectAcItem(item) {
  if (!item) return;
  const [t] = item;
  const input = document.getElementById("ticker-input");
  input.value = t;
  document.getElementById("clear-btn").style.display = "block";
  closeAc();
  loadTicker(t);
}

function closeAc() {
  document.getElementById("autocomplete").style.display = "none";
  acItems = []; acIndex = -1;
}

function tryLoadTicker(t) {
  closeAc();
  loadTicker(t);
}

/* ════════════════════════════════════════════════════════
   CHART – TradingView Advanced Widget
   ════════════════════════════════════════════════════════ */
let currentTicker   = null;
let currentExchange = null;

function loadTicker(ticker, forceExchange) {
  ticker = ticker.toUpperCase().trim();
  if (!ticker) return;

  const info = STOCK_MAP[ticker];
  let exchange;
  if (forceExchange) {
    exchange = forceExchange;
  } else if (info) {
    exchange = info.exchange;
  } else if (currentExFilter !== "ALL") {
    exchange = currentExFilter;
  } else {
    exchange = "HOSE";
  }

  currentTicker   = ticker;
  currentExchange = exchange;

  const tvSymbol = `${exchange}:${ticker}`;

  // Update pills
  document.querySelectorAll(".pill").forEach(p =>
    p.classList.toggle("active", p.dataset.ticker === ticker));

  // Status bar (XSS-safe DOM)
  const statusEl = document.getElementById("status-info");
  statusEl.textContent = "";
  const tickerSpan = document.createElement("span");
  tickerSpan.className = "status-ticker"; tickerSpan.textContent = ticker;
  statusEl.appendChild(tickerSpan);
  const nameText = info ? ` · ${info.name}` : "";
  statusEl.appendChild(document.createTextNode(`${nameText} · ${exchange}`));

  // Chart toolbar
  updateChartToolbar(ticker, info, exchange);

  document.getElementById("empty-state").style.display = "none";
  loadTVWidget(tvSymbol);
}

/* ─── Chart toolbar ──────────────────────────────────── */
function updateChartToolbar(ticker, info, activeExchange) {
  const toolbar = document.getElementById("chart-toolbar");
  toolbar.classList.add("visible");

  document.getElementById("ct-symbol").textContent = ticker;
  document.getElementById("ct-name").textContent   = info ? info.name : "";

  // Update active exchange button
  toolbar.querySelectorAll(".ex-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.ex === activeExchange);
  });
}

function setupChartToolbar() {
  document.querySelectorAll(".ex-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!currentTicker) return;
      loadTicker(currentTicker, btn.dataset.ex);
    });
  });
}

function loadTVWidget(symbol) {
  const container = document.getElementById("tv-chart-container");
  container.innerHTML = "";

  const render = () => {
    /* global TradingView */
    new TradingView.widget({
      autosize: true,
      symbol,
      interval: "D",
      timezone: "Asia/Ho_Chi_Minh",
      theme: "dark",
      style: "1",
      locale: "vi_VN",
      toolbar_bg: "#161b22",
      enable_publishing: false,
      hide_top_toolbar: false,
      hide_legend: false,
      withdateranges: true,
      range: "12M",
      save_image: false,
      container_id: "tv-chart-container",
      studies: ["Volume@tv-basicstudies","MACD@tv-basicstudies"],
      allow_symbol_change: true,
      show_popup_button: false,
    });
  };

  if (tvScriptLoaded) { render(); return; }

  const script = document.createElement("script");
  script.src = "https://s3.tradingview.com/tv.js";
  script.async = true;
  script.onload = () => { tvScriptLoaded = true; render(); };
  script.onerror = () => {
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;
           height:100%;flex-direction:column;gap:12px;color:#8b949e;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Không tải được widget TradingView.</p>
        <small>Kiểm tra kết nối internet rồi thử lại.</small>
      </div>`;
  };
  document.head.appendChild(script);
}
